name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.numpy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            numpy: "numpy==1.24.0"
          - python-version: "3.12"
            numpy: "numpy"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "${{ matrix.numpy }}" -e '.[dev]'
      - run: python -m pytest -q -ra --junitxml=outputs/test-results.xml
      - run: make test-workflow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-python-${{ matrix.python-version }}
          path: |
            outputs/test-results.xml
            outputs/test-workflow/report.*
            outputs/test-workflow/stability/

  optional:
    name: Torch CPU, SciPy, and Viser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,sampling,viser]'
      - name: Verify optional runtimes and local sockets
        run: |
          python - <<'PY'
          import socket
          import scipy
          import torch
          import trimesh
          import viser
          print("SciPy", scipy.__version__, "Torch", torch.__version__)
          with socket.socket() as server:
              server.bind(("127.0.0.1", 0))
          PY
      - run: python -m pytest -q -ra --junitxml=outputs/test-results.xml
      - run: python examples/reachability_workflow.py --urdf tests/fixtures/cartesian_stage.urdf --backend torch --device cpu --robustness-test --boundary-test --stability-test --stability-initial-guesses 2 --candidate-diversity --select-ik-solutions joint_limit_margin --output-dir outputs/torch-workflow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-runtimes
          path: |
            outputs/test-results.xml
            outputs/torch-workflow/report.*
            outputs/torch-workflow/stability/

  optional-floor:
    name: Optional dependency minimum versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch==2.1.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'numpy==1.24.0' 'scipy==1.10.0' 'viser==1.1.0' 'trimesh==4.0.0' -e '.[dev]'
      - name: Verify minimum optional runtimes
        run: |
          python - <<'PY'
          import scipy
          import torch
          import trimesh
          import viser
          PY
      - run: python -m pytest -q -ra --junitxml=outputs/optional-floor-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-floor
          path: outputs/optional-floor-tests.xml

  quality:
    name: Lint and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: python -m build
